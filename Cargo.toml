[package]
name = "driftwall"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Light, GPU-decoded live wallpapers for Windows: videos and pictures behind your desktop icons."
license = "MIT"
repository = "https://github.com/fsiuhgshiqoih32/driftwall"
readme = "README.md"
keywords = ["wallpaper", "live-wallpaper", "desktop", "windows", "video"]
categories = ["gui", "multimedia::video"]

[dependencies]
anyhow = "1"
eframe = { version = "0.37", features = ["glow"] }
log = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Display",
]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.18"
egui_kittest = { version = "0.37", features = ["wgpu", "eframe", "snapshot"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
